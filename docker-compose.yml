services:
  postgres:
    image: postgres:16-alpine
    container_name: kikos-crm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kikos_crm
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kikos_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
